name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装 flake8
        run: pip install flake8

      - name: 语法与未定义名检查
        # 只拦截真正的错误：语法错误、未定义变量、未使用导入等
        # （不检查代码风格，避免因格式问题误报失败）
        run: flake8 代码/project --select=E9,F63,F7,F82,F401,F841 --max-line-length=120 --exclude=__pycache__,.venv

      - name: 全量语法编译检查
        run: python -m compileall -q 代码/project

  smoke:
    name: 接口装配冒烟测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 配置 Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 安装轻量依赖
        # 这里不装 tensorflow / deepface / whisper 等重依赖，
        # 冒烟测试会用桩模块替代，从而把 CI 时间控制在 1 分钟内
        run: pip install fastapi uvicorn python-multipart pytest

      - name: 运行冒烟测试
        run: python tests/smoke_test.py

      - name: 运行 pytest
        run: pytest tests -q
